<body data-page="reprezentacija">

<div id="site-header"></div>

<main class="site-main">

<div class="phc-wrap">

<div id="phc-page-reprezentacija" class="phc-page-section active">
<div class="wrap">
  <div class="filter-bar">
    <div class="filter-group">
      <div class="filter-group-label-row">
        <span class="filter-group-label">Kategorija</span>
        <button class="radio-btn sve-btn mini active" id="repKatSveBtn" data-kat="sve">Sve</button>
      </div>
      <div class="radio-row" id="repKatRow"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-label-row">
        <span class="filter-group-label">Disciplina</span>
        <button class="radio-btn sve-btn mini active" id="repDisSveBtn" data-dis="sve">Sve</button>
      </div>
      <div class="radio-row" id="repDisRow"></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-label-row">
        <span class="filter-group-label">Sezona</span>
        <button class="radio-btn sve-btn mini active" id="repSeasonSveBtn">Sve</button>
      </div>
      <div class="season-controls">
        <div class="season-dd">
          <span class="season-dd-label">Od</span>
          <select id="repSeasonFrom"></select>
        </div>
        <div class="season-dd">
          <span class="season-dd-label">Do</span>
          <select id="repSeasonTo"></select>
        </div>
      </div>
    </div>
  </div>
  <div id="repContent"></div>
</div>
</div>

</div>

</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>
