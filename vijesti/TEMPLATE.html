<!DOCTYPE html>
<html lang="hr" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ============================================================
       UPUTA ZA UREDNIKA
       1. Napravi novi folder u vijesti/ s imenom u formatu yyyy-mm-dd
          Primjer: vijesti/2026-09-11/
          (datum je dovoljan jer nikad nema dvije vijesti istog dana)
       2. Ovaj file spremi u taj folder kao "index.html"
       3. Promijeni ova 3 meta taga:
  ============================================================ -->
  <meta name="datum"   content="2026-01-01">
  <meta name="naslov"  content="Naslov vijesti">
  <meta name="excerpt" content="Kratki opis vijesti koji se prikazuje na popisu vijesti (1-2 rečenice).">
  <!-- ============================================================
       4. Opcijski: ako imaš naslovnu sliku vijesti, stavi je u
          isti folder kao ovaj file (npr. 1.jpg) i upiši ime ovdje:
  ============================================================ -->
  <meta name="slika" content="">
  <!-- ============================================================ -->

  <title>Naslov vijesti – Hrvatski curling savez</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="icon"       href="../../assets/images/hcs-logo.png" type="image/png">
</head>
<body data-page="vijesti">

<div id="site-header"></div>

<main class="site-main">
  <article class="post-article">

    <header class="post-header">
      <div class="post-meta">
        <a href="../" class="back-link" data-hr="← Sve vijesti" data-en="← All news">← Sve vijesti</a>
        <time datetime="2026-01-01">01. 01. 2026.</time>
      </div>
      <h1 class="post-title">Naslov vijesti</h1>
    </header>

    <!-- Opcijska naslovna slika (fajl u istom folderu kao ovaj index.html):
    <div class="post-hero-image">
      <img src="1.jpg" alt="Opis slike">
    </div>
    -->

    <div class="post-content">

      <p>Ovdje piši tekst vijesti. Možeš koristiti standardne HTML tagove:</p>

      <p>Novi paragraf — novi <code>&lt;p&gt;</code> tag.</p>

      <p><strong>Podebljani tekst</strong> se piše s <code>&lt;strong&gt;</code>.</p>

      <p><em>Kurziv</em> se piše s <code>&lt;em&gt;</code>.</p>

      <!-- Slika unutar teksta (fajl u istom folderu kao ovaj index.html): -->
      <!--
      <img src="1.jpg" alt="Opis slike">
      -->

      <!-- YouTube video: sličica iste veličine kao fotke, u istoj .foto-grid-vijest mreži (može stajati uz fotke u istom redu).
           Klik otvara prozor s fotkama i videima; tek klikom na sličicu u prozoru učitava se YouTube.
           Najlakše ga je umetnuti u editoru (gumb 🎬). Ručno: zamijeni ID_VIDEA (11 znakova) i Naslov.
           Sličica je datoteka video-ID_VIDEA.jpg u istom folderu (ako je nema, skida je GitHub Action).
           Za okomite videe (Shorts) dodaj klasu video-tile-okomit na button.
      <div class="foto-grid-vijest">
        <a href="1.jpg" target="_blank"><img src="1.jpg" alt=""></a>
        <button type="button" class="video-tile" data-yt="ID_VIDEA" data-title="Naslov" aria-label="Video: Naslov">
          <img src="video-ID_VIDEA.jpg" alt="" loading="lazy" onerror="this.parentNode.classList.add('nema-slicice');this.remove()">
          <span class="video-tile-title">Naslov</span>
          <span class="video-tile-play" aria-hidden="true"></span>
        </button>
      </div>
      -->

    </div>

    <footer class="post-footer">
      <a href="../" class="back-link"
         data-hr="← Sve vijesti" data-en="← All news">← Sve vijesti</a>
    </footer>

  </article>
</main>

<script src="../../assets/js/header.js"></script>
<script src="../../assets/js/vijesti-lightbox.js"></script>
<script>
(function(){
  const d = document.querySelector('meta[name="datum"]');
  if (d) {
    const g = d.content.split('-')[0];
    document.querySelectorAll('.back-link').forEach(a => { a.href = '../#' + g; });
  }
})();
</script>
</body>
</html>
